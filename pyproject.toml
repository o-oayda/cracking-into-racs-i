[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ciri"
version = "0.1.0"
description = "Generate plots from Cracking Into Racs – I."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Oliver Oayda", email = "oaydaoliver@gmail.com"}
]
dependencies = [
    "snakemake==9.23.1",
    "dipole-utils",
    "catsim",
    "pandas",
    "anesthetic>=2.14.9",
    "getdist>=1.7.7",
]

[tool.uv.sources]
dipole-utils = { git = "https://github.com/o-oayda/dipole-utils.git" }
catsim = { git = "https://github.com/o-oayda/catsim.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/ciri"]
